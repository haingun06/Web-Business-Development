<html>
<head>
    <title>K244161798_Đinh Hải Ngân</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background-image: url("images/thodalab.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
        }

        iframe {
            display: block;
            width: 100%;
            border: none;
        }

        #menu {
            height: 250px;
        }

        #khung {
            display: none;
            width: 90%;
            min-height: 800px;
            margin: 20px auto;
            padding: 15px;
            box-sizing: border-box;
            background-color: white;
        }

        #content {
            width: 100%;
            height: 750px;
            background-color: white;
        }
    </style>
</head>
<body>
    <iframe src="menu.html" id="menu" name="menu"></iframe>

    <div id="khung">
        <iframe name="content" id="content"></iframe>
    </div>

    <script>
        window.addEventListener("message", function(event) {
            if (event.data === "hienNoiDung") {
                document.getElementById("khung").style.display = "block";
            }
        });
    </script>
    <script>
    window.addEventListener("message", function(event) {
        if (event.data === "hienNoiDung") {
            document.getElementById("khung").style.display = "block";
        }

        if (event.data === "veTrangChu") {
            document.getElementById("khung").style.display = "none";
            document.getElementById("content").src = "";
        }
    });
</script>
</body>
</html>
