<html>
    <head>
        <title>Travel Expense Report</title>
    <style>
        body {
            font-family: "Times New Roman", serif;
        }

        .container {
            width: 720px;
            margin: 20px;
            padding: 10px;
            background-color: #c7ffff;
            border-left: 3px solid blue;
            border-right: 3px solid blue;
            border-bottom: 1px solid blue;
        }

        .logo {
            text-align: center;
            margin-bottom: 15px;
        }

        .logo-box {
            display: inline-block;
            width: 450px;
            padding: 15px 0;
            background-color: #7b3600;
            color: #b9c7ff;
            font-size: 40px;
            font-family: cursive;
        }

        h2 {
            margin-top: 10px;
        }

        hr {
            border: none;
            border-top: 2px solid gray;
        }

        .form-row {
            margin: 14px 0;
        }

        input[type="text"] {
            height: 18px;
            border: 1px solid #9aaed0;
        }

        textarea {
            width: 440px;
            height: 60px;
            resize: none;
        }

        table {
            border-collapse: collapse;
            width: 580px;
            margin-top: 10px;
        }

        table,
        th,
        td {
            border: 1px solid gray;
        }

        th {
            font-weight: bold;
            text-align: center;
        }

        td {
            padding: 3px;
        }

        table input {
            box-sizing: border-box;
        }

        .date {
            width: 75px;
        }

        .description {
            width: 170px;
        }

        .amount {
            width: 50px;
        }

        select {
            height: 22px;
        }

        button {
            margin-top: 5px;
        }

        .footer {
            margin-top: 15px;
        }
    </style>
    </head>
<body>

<div class="container">
    <div style="text-align: center;">
       <img src="hinh/DeLong.jpg"/>
    </div>

    <h2>Travel Expense Report</h2>

    <hr>

    <form id="travelForm">

        <div class="form-row">
            1) First Name:
            <input type="text" name="firstName">

            Last Name:
            <input type="text" name="lastName">
        </div>

        <div class="form-row">
            2) Social Security Number:
            <input type="text" name="ssn">
        </div>

        <div class="form-row">
            3) Department:

            <select name="department">
                <option>Accounting</option>
                <option>Marketing</option>
                <option>Sales</option>
                <option>Human Resources</option>
                <option>IT</option>
            </select>
        </div>

        <div class="form-row">
            4) Describe the purpose of your trip:
        </div>

        <textarea name="purpose"></textarea>

        <div class="form-row">
            5) Itemize your travel expenses
        </div>

        <table>
            <tr>
                <th>Date</th>
                <th>Description</th>
                <th>Category</th>
                <th>Amount</th>
            </tr>

            <tr>
                <td>
                    <input class="date" type="text" placeholder="mm/dd/yy">
                </td>

                <td>
                    <input class="description" type="text">
                </td>

                <td>
                    <select>
                        <option>Meal</option>
                        <option>Hotel</option>
                        <option>Transportation</option>
                        <option>Other</option>
                    </select>
                </td>

                <td>
                    <input class="amount" type="text">
                </td>
            </tr>

            <tr>
                <td>
                    <input class="date" type="text" placeholder="mm/dd/yy">
                </td>

                <td>
                    <input class="description" type="text">
                </td>

                <td>
                    <select>
                        <option>Meal</option>
                        <option>Hotel</option>
                        <option>Transportation</option>
                        <option>Other</option>
                    </select>
                </td>

                <td>
                    <input class="amount" type="text">
                </td>
            </tr>

            <tr>
                <td>
                    <input class="date" type="text" placeholder="mm/dd/yy">
                </td>

                <td>
                    <input class="description" type="text">
                </td>

                <td>
                    <select>
                        <option>Meal</option>
                        <option>Hotel</option>
                        <option>Transportation</option>
                        <option>Other</option>
                    </select>
                </td>

                <td>
                    <input class="amount" type="text">
                </td>
            </tr>

            <tr>
                <td>
                    <input class="date" type="text" placeholder="mm/dd/yy">
                </td>

                <td>
                    <input class="description" type="text">
                </td>

                <td>
                    <select>
                        <option>Meal</option>
                        <option>Hotel</option>
                        <option>Transportation</option>
                        <option>Other</option>
                    </select>
                </td>

                <td>
                    <input class="amount" type="text">
                </td>
            </tr>

        </table>

        <div class="form-row">
            6) Have you submitted your receipts?

            <input type="radio" name="receipt" value="yes">
            Yes

            <input type="radio" name="receipt" value="no">
            No
        </div>

        <button type="submit">
            Submit travel expenses
        </button>

        <button type="reset">
            Reset
        </button>

    </form>

    <div class="footer">
        Questions? Contact Debbie Larson in Accounting (ext. 2150).
    </div>

</div>

<script>
    const form = document.getElementById("travelForm");

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        alert("Submit thành công!");
    });

    form.addEventListener("reset", function() {
        setTimeout(function() {
            alert("Đã xóa trắng ô nhập!");
        }, 0);
    });
</script>

</body>
</html>
